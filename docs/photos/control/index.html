<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Photo contest control · Tommy &amp; Jeyan</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#050403" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316121f'/%3E%3Cellipse cx='16' cy='15' rx='8' ry='10' fill='%23f6dcbe'/%3E%3Cellipse cx='16' cy='24' rx='3' ry='2.4' fill='%23ffefc9'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
/* Tokens from the photos page (docs/photos/index.html) */
:root{
  --night-deep:#050403; --night:#090706; --dusk:#1b1110; --raise:#271916;
  --moon:#f4eddd; --moon-soft:rgba(244,237,221,.82); --moon-dim:#bfb6a4;
  --rose-light:#cf9a93; --rose-deep:#945a52; --gold-light:#d8bc82;
  --lan-core:#fff1a8; --lan-mid:#ffb84f; --danger:#8f2f2a; --ok:#b9d6a3;
  --serif:'Cormorant Garamond', Georgia, serif;
  --sans:'Montserrat', 'Helvetica Neue', Arial, sans-serif;
}
*,*::before,*::after{ box-sizing:border-box; }
html{ background:var(--night-deep); }
body{ margin:0; min-height:100vh; background:var(--night-deep); color:var(--moon); font:400 16px/1.45 var(--sans); -webkit-font-smoothing:antialiased; }
:focus-visible{ outline:3px solid var(--lan-core); outline-offset:2px; border-radius:6px; }
[hidden]{ display:none !important; }
#app{ max-width:560px; margin:0 auto; padding-bottom:96px; }
h1,h2,h3{ font-family:var(--serif); font-weight:500; margin:0; line-height:1.15; }
h1{ font-size:32px; } h2{ font-size:26px; } h3{ font-size:22px; }
p{ margin:8px 0; }
.muted{ color:var(--moon-dim); font-size:15px; }
.ok{ color:var(--ok); font-weight:600; }
.loading{ padding:40px 16px; text-align:center; color:var(--moon-dim); }

/* Buttons: 52 px high, plain */
.btn{
  font:600 16px/1.2 var(--sans); min-height:52px; padding:10px 18px; border-radius:12px; cursor:pointer;
  border:2px solid var(--gold-light); background:transparent; color:var(--moon); flex:1 1 auto; text-align:center;
}
.btn.primary{ background:var(--rose-deep); border-color:var(--rose-deep); color:#fff; }
.btn.danger{ background:var(--danger); border-color:var(--danger); color:#fff; }
.btn.dark{ background:#2a1a05; border-color:#2a1a05; color:#fff1a8; }
.btn.darkline{ background:transparent; border-color:#2a1a05; color:#2a1a05; }
.btn[aria-pressed="true"]{ background:var(--moon); border-color:var(--moon); color:var(--night-deep); }
.btn[disabled]{ opacity:.4; cursor:not-allowed; }
.btns{ display:flex; flex-wrap:wrap; gap:10px; margin:10px 0 4px; }
.busy .btn{ opacity:.6; }
.busy .tab{ opacity:1; }

/* Sticky top: practice banner, who's running, tabs */
#top{ position:sticky; top:0; z-index:10; background:var(--night-deep); padding:0 16px 8px; border-bottom:1px solid rgba(216,188,130,.25); }
.practice{ margin:0 -16px 8px; padding:10px 16px; background:var(--lan-core); color:#2a1a05; display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; font-size:15px; }
.practice b{ flex:1 1 100%; font-weight:600; }
.practice .btns{ margin:0; }
.practice .btn{ min-height:48px; flex:0 1 auto; }
.bar{ display:flex; justify-content:space-between; align-items:center; padding:8px 0 0; font-size:15px; color:var(--moon-soft); }
.link{ font:500 15px var(--sans); min-height:48px; padding:0 8px; background:none; border:0; color:var(--gold-light); text-decoration:underline; cursor:pointer; }
.tabs{ display:flex; gap:8px; }
.tab{ flex:1; min-height:52px; border-radius:12px; border:2px solid var(--gold-light); background:transparent; color:var(--moon); font:600 16px var(--sans); cursor:pointer; }
.tab[aria-selected="true"]{ background:var(--moon); border-color:var(--moon); color:var(--night-deep); }
.last{ margin:0 0 12px; font-size:14px; color:var(--moon-dim); }
.off{ margin:8px 0 0; font-size:14px; color:var(--lan-mid); font-weight:600; }

main{ padding:12px 16px; }

/* Run sheet */
.step{ display:flex; gap:12px; padding:16px 14px; margin:0 0 14px; background:var(--dusk); border:1px solid rgba(216,188,130,.22); border-radius:14px; }
.step.next{ border:3px solid var(--lan-mid); padding:14px 12px; box-shadow:0 0 22px rgba(255,184,79,.2); }
.step.done{ opacity:.72; }
.mark{ flex:none; width:40px; height:40px; border-radius:50%; background:var(--raise); border:2px solid var(--gold-light); display:grid; place-items:center; font:600 18px var(--sans); }
.step.next .mark{ background:var(--lan-mid); border-color:var(--lan-mid); color:#2a1a05; }
.step.done .mark{ background:var(--ok); border-color:var(--ok); color:#17210f; }
.body{ flex:1; min-width:0; }
.what{ color:var(--moon-soft); font-size:15px; }
.moments{ display:grid; gap:8px; margin-top:10px; }
.moment{ background:var(--raise); border-radius:12px; border:1px solid rgba(216,188,130,.2); overflow:hidden; }
.moment.now{ border:2px solid var(--lan-mid); }
.moment .head{
  width:100%; min-height:52px; padding:8px 12px; display:flex; justify-content:space-between; align-items:center; gap:8px;
  background:none; border:0; color:var(--moon); text-align:left; font:600 16px var(--sans); cursor:pointer;
}
.head.static{ cursor:default; border-bottom:1px solid rgba(216,188,130,.15); }
.pill{ font:500 13px var(--sans); padding:3px 10px; border-radius:99px; border:1px solid var(--gold-light); color:var(--gold-light); white-space:nowrap; }
.moment .in{ padding:0 12px 12px; }
.review{ margin:12px 0; padding:12px; background:var(--raise); border-radius:12px; }
.tie{ margin:10px 0; padding:10px; border:2px solid var(--lan-core); border-radius:12px; }

/* Cards on the Everything tab */
.card{ margin:0 0 18px; padding:14px; background:var(--dusk); border:1px solid rgba(216,188,130,.22); border-radius:14px; }
.card > h2{ margin-bottom:6px; }
.card .moment{ margin-top:10px; }
.lbl{ margin:14px 0 0; font-weight:600; }
.srow{ display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:4px 10px; margin-top:8px; }
.srow .t{ flex:1 1 140px; font-weight:500; }
.srow .btns{ margin:0; flex:1 1 220px; }
.seg .btn{ flex:1; }

/* Photo rows */
.rows{ list-style:none; margin:8px 0; padding:0; display:grid; gap:8px; }
.rows li{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; padding:8px; background:rgba(5,4,3,.4); border-radius:10px; }
.th{ width:56px; height:56px; object-fit:cover; border-radius:8px; background:#1a1311; flex:none; }
.who{ flex:1 1 120px; min-width:0; }
.who b{ font-weight:600; }
.who small{ display:block; color:var(--moon-dim); font-size:13px; }
.n{ display:inline-block; min-width:28px; padding:0 6px; border-radius:99px; background:var(--rose-deep); color:#fff; font:600 14px/24px var(--sans); text-align:center; }
.votes{ font-weight:600; white-space:nowrap; }
.tag{ font:500 12px var(--sans); color:var(--gold-light); }
.rows li > .btn{ flex:0 0 auto; min-width:92px; }
.rows.stack li > .btns{ flex:1 1 100%; margin:0; }
.ask{ flex:1 1 100%; font-weight:600; color:var(--lan-core); }
.log{ margin:8px 0 0; padding-left:0; list-style:none; font-size:14px; color:var(--moon-soft); }
.log li{ padding:6px 0; border-bottom:1px solid rgba(216,188,130,.12); }

/* Gate */
.gate{ display:grid; gap:12px; padding:32px 16px; }
.gate label{ font-weight:600; }
.gate input{ font:400 16px var(--sans); min-height:52px; padding:0 14px; border-radius:12px; border:2px solid var(--gold-light); background:var(--moon); color:#1b1110; }
.err{ color:var(--lan-mid); font-weight:600; }

#note{
  position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:30; max-width:calc(100% - 32px);
  background:var(--moon); color:var(--night-deep); border-radius:12px; padding:12px 18px; font-weight:600; box-shadow:0 4px 18px rgba(0,0,0,.5); text-align:center;
}
@media (prefers-reduced-motion:no-preference){ .btn{ transition:background .15s, opacity .15s; } }
</style>
</head>
<body>
<div id="app"><p class="loading">Loading…</p></div>
<div id="note" role="status" aria-live="polite" hidden></div>
<noscript><p class="loading">This page needs JavaScript.</p></noscript>
<script type="module" src="control.js"></script>
</body>
</html>
