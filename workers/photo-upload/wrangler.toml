name = "tj-photo-upload"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false

# Custom domain on the tomyjeyan.com zone. Cloudflare creates the upload DNS
# record itself; the apex/www records pointing at GitHub Pages are untouched.
routes = [
  { pattern = "upload.tomyjeyan.com", custom_domain = true }
]

# Secrets, not vars (the repo is public). tools/photo_drive_setup.py --push
# sets all five; by hand it's `npx wrangler secret put NAME` for each:
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_REFRESH_TOKEN,
#   DRIVE_FOLDER_ID, PHOTO_PASSWORD
#
# Tests only: GOOGLE_TOKEN_URL and GOOGLE_UPLOAD_BASE point the Worker at a
# stand-in Google. Never set them in production.
