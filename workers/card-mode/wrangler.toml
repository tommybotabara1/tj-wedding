name = "tj-card-mode"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false

# Custom domain on the tomyjeyan.com zone. Cloudflare creates the card DNS
# record itself; the apex/www records pointing at GitHub Pages are untouched.
routes = [
  { pattern = "card.tomyjeyan.com", custom_domain = true }
]

# Which card tomyjeyan.com/jeyan/ opens on. Key "jeyan" → "pal" | "personal".
kv_namespaces = [
  { binding = "CARD_MODE", id = "5f8377ca19e74fd6b20bb68a99465608" }
]

# Secret, not a var: set with `npx wrangler secret put OWNER_KEY`.
# OWNER_KEY = the key in Jeyan's private owner link (CARD_OWNER_KEY in .env).
